name: Production backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate backup secrets
        shell: bash
        run: |
          : "${SUPABASE_DB_URL:?Missing SUPABASE_DB_URL}"
          : "${SUPABASE_URL:?Missing SUPABASE_URL}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing SUPABASE_SERVICE_ROLE_KEY}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE}"

      - name: Dump database and private Storage
        shell: bash
        run: |
          mkdir -p backup/database backup/storage
          # Do not load the app's OAuth configuration or migrations for a dump.
          mkdir -p "$RUNNER_TEMP/trackify-backup"
          supabase init --workdir "$RUNNER_TEMP/trackify-backup"
          supabase db dump --workdir "$RUNNER_TEMP/trackify-backup" --db-url "$SUPABASE_DB_URL" --role-only -f "$GITHUB_WORKSPACE/backup/database/roles.sql"
          supabase db dump --workdir "$RUNNER_TEMP/trackify-backup" --db-url "$SUPABASE_DB_URL" -f "$GITHUB_WORKSPACE/backup/database/schema.sql"
          supabase db dump --workdir "$RUNNER_TEMP/trackify-backup" --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f "$GITHUB_WORKSPACE/backup/database/data.sql"
          node scripts/backup-storage.mjs backup/storage
          (cd backup && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Encrypt archive
        shell: bash
        run: |
          tar -C backup -czf backup.tar.gz .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.tar.gz \
            -out "production-backup-$(date -u +%Y-%m-%d).tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          rm backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: production-backup-*.tar.gz.enc
          retention-days: 35
          if-no-files-found: error

      - name: Verify encrypted archive and restore into isolated Supabase
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/trackify-restore"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "production-backup-$(date -u +%Y-%m-%d).tar.gz.enc" \
            -out "$RUNNER_TEMP/trackify-restore/archive.tar.gz" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          tar -C "$RUNNER_TEMP/trackify-restore" -xzf "$RUNNER_TEMP/trackify-restore/archive.tar.gz"
          (cd "$RUNNER_TEMP/trackify-restore" && sha256sum --check SHA256SUMS)
          # A plain PostgreSQL image lacks Supabase's auth/storage schemas and roles.
          supabase start --workdir "$RUNNER_TEMP/trackify-backup" -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --single-transaction -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/trackify-restore/database/roles.sql" \
            -f "$RUNNER_TEMP/trackify-restore/database/schema.sql" \
            -c 'SET session_replication_role = replica' \
            -f "$RUNNER_TEMP/trackify-restore/database/data.sql"
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 \
            -c 'select count(*) as profiles from public.profiles; select count(*) as time_entries from public.time_entries;'
          echo 'Encrypted archive, file checksums and isolated database restore passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop isolated restore services
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/trackify-backup" --no-backup
