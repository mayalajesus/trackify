name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    needs: static-and-domain
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: qa
      VITE_APP_URL: http://localhost:5173
      VITE_AUTH_PROVIDER: neon
      VITE_NEON_AUTH_URL: ${{ secrets.QA_NEON_AUTH_URL }}
      DATABASE_PROVIDER: neon
      DATABASE_ENV: qa
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      QA_OWNER_EMAIL: ${{ secrets.QA_OWNER_EMAIL }}
      QA_OWNER_PASSWORD: ${{ secrets.QA_OWNER_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_MEMBER_EMAIL: ${{ secrets.QA_MEMBER_EMAIL }}
      QA_MEMBER_PASSWORD: ${{ secrets.QA_MEMBER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run test:smoke
      - run: npm run test:a11y
